<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Filtro estilo GameJolt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="filter-bar">

  <div class="tabs">
    <button class="tab active">Featured</button>
    <button class="tab">Hot</button>
    <button class="tab">Best</button>
    <button class="tab">New</button>
  </div>

  <div class="filters">
    <select>
      <option>Price</option>
    </select>
    <select>
      <option>OS</option>
    </select>
    <select>
      <option>Browser</option>
    </select>
    <select>
      <option>Maturity</option>
    </select>
    <select>
      <option>Status</option>
    </select>
    <select>
      <option>Partners</option>
    </select>
  </div>

</div>

</body>
</html>

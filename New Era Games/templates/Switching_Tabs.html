<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switching Tabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
        background: black;
      }
      .container {
        width: 500px;
        height: 300px;
        display: flex;
        position: relative;
      }
      input {
        display: none;
      }
      .tab-name {
        color: white;
        font-family: poppins;
        height: 45px;
        background: rgba(255, 255, 255, 0.25);
        padding: 10px 30px;
        box-sizing: border-box;
        cursor: pointer;
        transition: 0.25s;
      }
      input:checked + label .tab-name {
        background: #961fd1;
        color: black;
        font-size: 18px;
        font-weight: 800;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
      }
      input:checked + label .tab-content {
        opacity: 1;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="radio" name="option" id="1" checked />
      <label for="1">
        <div class="tab-name">Home</div>
      </label>
      <input type="radio" name="option" id="2" />
      <label for="2">
        <div class="tab-name">Blog</div>
      </label>
      <input type="radio" name="option" id="3" />
      <label for="3">
        <div class="tab-name">Shop</div>
      </label>
      <input type="radio" name="option" id="4" />
      <label for="4">
        <div class="tab-name">News</div>
      </label>
    </div>
  </body>
</html>
